name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request makes its running checks moot. On main every
# commit is checked: a group allows one pending run and cancels it for a newer
# one whatever cancel-in-progress says, so each commit there has a group of its
# own
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows excluded: Unix domain sockets not supported in Python on Windows
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      # Install FlatBuffers compiler
      - name: Install flatc (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y flatbuffers-compiler

      - name: Install flatc (macOS)
        if: runner.os == 'macOS'
        run: brew install flatbuffers

      - name: Set up Java 22
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "22"
          # The build's dependencies, so that it does not fetch them from Maven
          # Central every time: that answers 429 to busy runners
          cache: gradle

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"
          # Sets UV_PYTHON; without it .python-version (3.13) wins for every job
          python-version: ${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: |
          uv run python --version
          uv run pytest -v

      # The build left a daemon holding locks in ~/.gradle/caches, which
      # setup-java saves after the last step
      - name: Stop Gradle
        if: always()
        run: ./gradlew --stop

  # The server on a classpath that brings its own Arrow: it starts from the thin
  # JAR there and runs on Spark's Arrow, Netty, Jackson and FlatBuffers. The two
  # versions differ in all four (4.1.1: Arrow 18.3; 4.3.0: Arrow 19.0).
  spark:
    name: Spark ${{ matrix.spark-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spark-version: ["4.1.1", "4.3.0"]

    steps:
      - uses: actions/checkout@v7

      - name: Install flatc
        run: sudo apt-get update && sudo apt-get install -y flatbuffers-compiler

      - name: Set up Java 22
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "22"
          # The build's dependencies, so that it does not fetch them from Maven
          # Central every time: that answers 429 to busy runners
          cache: gradle

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      # pyspark's package has Spark's JARs in it, which is all that is used of it
      - name: Install Spark ${{ matrix.spark-version }}
        run: uv pip install pyspark==${{ matrix.spark-version }}

      - name: Run the Spark tests
        env:
          GATUN_REQUIRE_SPARK: ${{ matrix.spark-version }}
        run: uv run --no-sync pytest -v --no-cov tests/test_spark_integration.py

      - name: Run the suite with the server on Spark's classpath
        run: |
          jars="$(uv run --no-sync python -c 'import pathlib, pyspark; print(pathlib.Path(pyspark.__file__).parent / "jars")')"
          ls "$jars" | grep -c .
          # The point of this step: the server runs on Spark's Arrow, not its own
          uv run --no-sync python -c 'import sys; from gatun import launcher; assert launcher._server_jar([sys.argv[1]]) == launcher.THIN_JAR_PATH' "$jars/*"
          GATUN_TEST_CLASSPATH="$jars/*" uv run --no-sync pytest -v --no-cov

      - name: Stop Gradle
        if: always()
        run: ./gradlew --stop
